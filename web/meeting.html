<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议纪要</title>
<style>
  body{font-family:system-ui,"PingFang SC",sans-serif;background:#0f1115;color:#eee;margin:0;padding:24px;max-width:860px;margin:0 auto}
  h1{font-size:22px}h2{font-size:17px;color:#9ec7ff;margin-top:26px}
  .card{background:rgba(255,255,255,.05);border-radius:14px;padding:18px 20px;margin-top:14px}
  label{display:block;margin:10px 0 4px;color:#aab;font-size:14px}
  input,select{font-size:15px;padding:9px 12px;border-radius:9px;border:1px solid #333;background:#1a1d24;color:#fff;width:100%;box-sizing:border-box}
  button{font-size:16px;padding:12px 22px;border:0;border-radius:10px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5}
  #prog{white-space:pre-wrap;font-size:13px;color:#9aa0aa;line-height:1.8;min-height:24px}
  .docs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  pre{white-space:pre-wrap;font-size:13px;background:#0b0d11;border-radius:10px;padding:14px;max-height:50vh;overflow:auto}
  .dl{font-size:14px;background:#1f7a44;padding:8px 14px;margin-top:8px;display:inline-block;border-radius:8px;color:#fff;cursor:pointer;border:0}
  .tip{color:#9aa0aa;font-size:13px}
</style>
</head>
<body>
  <h1>📝 会议纪要 / 记录</h1>
  <p class="tip">上传会议录音 → 自动转写 + 分人 + 出<b>会议纪要</b>和<b>会议记录</b>。30 分钟会议约 2-3 分钟出结果。</p>

  <div class="card">
    <label>会议录音（m4a / mp3 / wav / mp4 …）</label>
    <input type="file" id="file" accept="audio/*,video/*">
    <label>会议语言</label>
    <select id="lang"><option value="zh">中文</option><option value="en">英文</option><option value="auto">自动检测</option></select>
    <label>我是哪个说话人（可留空，转写后看记录再定）</label>
    <input id="me" placeholder="例如 说话人A（留空则不标我的待办）">
    <label>访问口令</label>
    <input id="pw" type="password" placeholder="口令">
    <button id="go">开始处理</button>
  </div>

  <div class="card" id="run" style="display:none">
    <h2>进度</h2>
    <div id="prog"></div>
  </div>

  <div id="result" style="display:none">
    <h2>结果</h2>
    <div class="docs">
      <div><b>📋 会议纪要</b><br><button class="dl" id="dlm">下载纪要</button><pre id="md"></pre></div>
      <div><b>📜 会议记录</b><br><button class="dl" id="dlr">下载记录</button><pre id="rd"></pre></div>
    </div>
  </div>

<script>
const $=id=>document.getElementById(id);
let minutes="", record="";

$('go').onclick=async()=>{
  const f=$('file').files[0];
  if(!f){alert('选个录音文件');return;}
  const pw=$('pw').value.trim(); if(pw)sessionStorage.setItem('cap_pw',pw);
  $('go').disabled=true; $('run').style.display='block'; $('result').style.display='none';
  $('prog').textContent='上传中…';
  const fd=new FormData();
  fd.append('audio',f); fd.append('language',$('lang').value); fd.append('me',$('me').value.trim()); fd.append('pw',pw);
  let job;
  try{
    const r=await fetch('/meeting/upload',{method:'POST',body:fd});
    const d=await r.json();
    if(d.error){ $('prog').textContent='错误：'+d.error; $('go').disabled=false; return; }
    job=d.job;
  }catch(e){ $('prog').textContent='上传失败：'+e; $('go').disabled=false; return; }

  // 轮询进度
  const poll=setInterval(async()=>{
    const r=await fetch('/meeting/status/'+job); const d=await r.json();
    $('prog').textContent=(d.all||[]).join('\n');
    if(d.done){
      clearInterval(poll); $('go').disabled=false;
      if(d.error){ $('prog').textContent+='\n❌ '+d.error; return; }
      minutes=d.minutes||''; record=d.record||'';
      $('md').textContent=minutes; $('rd').textContent=record;
      $('result').style.display='block';
    }
  },1500);
};

function dl(name,txt){ const b=new Blob([txt],{type:'text/markdown;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
$('dlm').onclick=()=>dl('会议纪要.md',minutes);
$('dlr').onclick=()=>dl('会议记录.md',record);

// 预填口令
if(sessionStorage.getItem('cap_pw'))$('pw').value=sessionStorage.getItem('cap_pw');
</script>
</body>
</html>
